[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacosort"
version = "0.1.0"
description = "Automatically organize all your email accounts with one consistent folder scheme, and keep them organized."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TacoSort contributors" }]
keywords = ["email", "imap", "gmail", "outlook", "inbox", "organize", "filters", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
]
dependencies = [
    "IMAPClient>=3.0",
    "keyring>=24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=2.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tacosort = "tacosort.cli:main"

[project.gui-scripts]
tacosort-app = "tacosort.app:main"

[tool.setuptools.packages.find]
include = ["tacosort*"]

[tool.setuptools.package-data]
tacosort = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
