[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtidy"
version = "0.1.0"
description = "Automatically organize all your email accounts with one consistent folder scheme, and keep them organized."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MailTidy contributors" }]
keywords = ["email", "imap", "gmail", "outlook", "inbox", "organize", "filters", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Environment :: Console",
]
dependencies = [
    "IMAPClient>=3.0",
    "keyring>=24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=2.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mailtidy = "mailtidy.cli:main"

[tool.setuptools.packages.find]
include = ["mailtidy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
