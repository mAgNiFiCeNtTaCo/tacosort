name: Idea or request
description: Suggest a feature, a new provider, or a kind of mail TacoSort should recognise
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please don't paste real emails or addresses; use `example.com`.
  - type: textarea
    id: problem
    attributes:
      label: What would you like TacoSort to do?
      description: Describe the problem it would solve for you, in your own words.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: "For sorting ideas: the kind of sender, a typical subject, and the folder you'd expect."
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried?
      description: For example a rule in the settings file that almost works.
