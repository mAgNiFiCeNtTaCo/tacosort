name: Something went wrong
description: MailTidy crashed, showed an error, or sorted mail wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting!

        **Please do NOT paste real emails, email addresses, passwords, app passwords or tokens here.**
        This page is public. Describe messages instead, and write addresses as `someone@example.com`.
        For security problems, use the private "Report a vulnerability" button on the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I ran `mailtidy run` and a shipping notice from a shoe shop went to Promotions instead of Receipts."
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message (described, not pasted)
      description: |
        If a message was sorted wrongly: the kind of sender (shop, bank, friend...), the subject (with
        personal details removed), and the output of `mailtidy rules test --from sender@example.com --subject "..."`.
      render: text
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: Copy what MailTidy printed. Remove any email addresses first.
      render: text
  - type: input
    id: version
    attributes:
      label: MailTidy version
      description: Output of `mailtidy --version`
      placeholder: mailtidy 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Email provider
      multiple: true
      options: [Gmail, Outlook.com / Hotmail, Yahoo, iCloud, AOL, Fastmail, Zoho, GMX, Proton Mail Bridge, Other]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste any real email, email address, password or token.
          required: true
