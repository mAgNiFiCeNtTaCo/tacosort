name: Build the app

# Builds the downloadable app (packaging/build.py) on Windows, macOS and Linux. Started by hand
# (Actions > Build the app > Run workflow) the files are kept with the run for 30 days; a pushed version
# tag (v0.1.0) also publishes them on a GitHub release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write        # for the build record below (who built which file, from which commit)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: a binary built there also runs on older Linux (glibc); macos-latest = Apple silicon
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      # Actions are pinned to exact commits (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      # Exact versions with hashes (packaging/requirements-build.txt): a package changed on PyPI stops
      # the build instead of going into the app.
      - name: Install
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Build and check
        run: python packaging/build.py
      # A signed record that this file was built here from this commit:
      # gh attestation verify <file> -R mAgNiFiCeNtTaCo/tacosort
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/TacoSort-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: TacoSort-${{ matrix.os }}
          path: dist/TacoSort-*
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          (cd dist && sha256sum TacoSort-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/TacoSort-* dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --title "TacoSort $GITHUB_REF_NAME" --generate-notes
